# cargo-audit allow-list. Keep every entry narrowly scoped and documented.

[advisories]
ignore = [
    # RUSTSEC-2023-0071 — rsa 0.9.x "Marvin Attack" timing side channel.
    # No fixed stable rsa release is available. tsp-ltv delegates RSA to
    # Kryptering; deployments requiring timing-resistant private RSA should
    # use its PKCS#11 path. Remove this entry when RustCrypto ships the fix.
    # Upstream: https://github.com/RustCrypto/RSA/issues/19
    "RUSTSEC-2023-0071",
]
